# SDD Config — flow-controller
# Auto-generated by sdd-init. Edit as needed.

context: |
  flow-controller: media management orchestrator with FastAPI backend (Python 3.11)
  and React 19 + TypeScript frontend (Vite 7). Backend handles file copy orchestration,
  service health checks (Radarr/Sonarr/aMuleTorrent), and Docker deployment.
  Frontend provides a stage-based UI for monitoring and controlling media flows.

strict_tdd: false  # No workspace-level test command covers both projects

projects:
  - path: backend/
    stack: python-3.11
    test_command: "cd backend && python -m pytest tests.py -v"
    test_layers:
      unit: { available: true, tool: pytest }
      integration: { available: false, tool: null }
      e2e: { available: false, tool: null }
    coverage: { available: false, command: null }
    quality:
      linter: { available: false, command: null }
      type_checker: { available: false, command: null }
      formatter: { available: false, command: null }

  - path: frontend/
    stack: react-19-typescript-vite-7
    test_command: "cd frontend && npx vitest run"
    test_layers:
      unit: { available: true, tool: vitest + @testing-library/react }
      integration: { available: false, tool: null }
      e2e: { available: false, tool: null }
    coverage: { available: false, command: null }
    quality:
      linter: { available: true, command: "cd frontend && npx eslint src/" }
      type_checker: { available: true, command: "cd frontend && npx tsc -b --noEmit" }
      formatter: { available: false, command: null }

phases:
  proposal: { required: true }
  spec: { required: true }
  design: { required: true }
  tasks: { required: true }
  apply: { required: true }
  verify: { required: true }
  archive: { required: true }
