# Docker Compose para despliegue con imagen de GHCR
# Uso: docker compose -f docker-compose.deploy.yml up -d
#
# Las variables de entorno se configuran en Portainer o directamente aqui.

services:
  flow-controller:
    image: ghcr.io/alountk/flow-controller:latest
    container_name: flow-controller
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # Radarr
      - RADARR_URL=${RADARR_URL:-http://localhost:7878}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      # Sonarr
      - SONARR_URL=${SONARR_URL:-http://localhost:8989}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      # AmuTorrent
      - AMUTORRENT_URL=${AMUTORRENT_URL:-http://localhost:4000}
      - AMUTORRENT_API_KEY=${AMUTORRENT_API_KEY:-}
      - AMUTORRENT_USER=${AMUTORRENT_USER:-admin}
      - AMUTORRENT_PASSWORD=${AMUTORRENT_PASSWORD:-}
      # Seguridad
      - SAFE_MODE=${SAFE_MODE:-true}
      - API_KEY=${API_KEY:-}
      # Desarrollador
      - DEVELOPER=${DEVELOPER:-false}
      # Rutas de descarga
      - FOLDER_DOWNLOAD_AMULE=${FOLDER_DOWNLOAD_AMULE:-/mnt/storage-6tb/shared-downloads/amule}
      - FOLDER_DOWNLOAD_TORRENT=${FOLDER_DOWNLOAD_TORRENT:-/mnt/storage/downloads/qbittorrent/completed}
      # Intervalos
      - CHECK_INTERVAL=${CHECK_INTERVAL:-15}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY=${RETRY_DELAY:-2}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-5}
      - IMPORT_TIMEOUT=${IMPORT_TIMEOUT:-40}
      # Trazabilidad
      - TRACE_LIMIT=${TRACE_LIMIT:-25}
      - AMUTORRENT_INDEXER=${AMUTORRENT_INDEXER:-}
      # aMule-watchdog: reinicio del contenedor por la Engine API, a través del
      # socket-proxy de abajo (flow-controller ya no monta el socket de Docker).
      - DOCKER_HOST=${DOCKER_HOST:-tcp://127.0.0.1:2375}
      # IP(s) del reverse proxy en las que uvicorn confía para leer X-Forwarded-For.
      # Sin esto, detrás del proxy todos los clientes comparten la dirección del
      # proxy y 10 claves erróneas bloquean a todos (límite de 401). Pon aquí la IP
      # desde la que el proxy conecta con flow-controller.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Puerto del servidor
      - PORT=${PORT:-8000}
    volumes:
      - /mnt/storage/config/flow-control:/app/config
      - /mnt/storage:/mnt/storage:rw
      - /mnt/storage-6tb:/mnt/storage-6tb:rw


  # Único contenedor con acceso al socket de Docker. Sólo deja pasar
  # `GET /containers/json` y el reinicio de contenedores; el resto de la Engine
  # API (crear contenedores, montar el host...) responde 403. Escucha sólo en
  # loopback: flow-controller (network_mode: host) lo alcanza en 127.0.0.1:2375.
  # Si el reinicio del watchdog diera 403, el watchdog queda en solo-detección
  # con la razón visible; no se arregla abriendo POST=1 sin revisarlo antes.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - ALLOW_RESTARTS=1
      - POST=0
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
