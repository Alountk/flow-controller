name: CI — Build, Test & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  # Matches the runtime in the Dockerfile (node:22-alpine).
  # jsdom@30 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0.
  NODE_VERSION: "22"

jobs:
  # ── Backend tests ──────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run all backend tests
        run: |
          cd backend
          python -m pytest -v --tb=short

  # ── Frontend build ─────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

      - name: TypeScript check + Vite build
        run: |
          cd frontend
          npm run build

  # ── Docker build + health check ────────────────────────────────
  docker-verify:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build --no-cache

      - name: Start container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          sleep 15

      - name: Health check (port 8000)
        run: |
          # /api/health is the liveness probe: /api/status carries real data and
          # now requires the API key, which CI does not have.
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "⏳ Attempt $i: HTTP $STATUS — retrying in 3s..."
            sleep 3
          done
          echo "❌ Backend did not start within 45s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=50
          exit 1

      - name: Frontend served by backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ 2>/dev/null || true)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend served (HTTP $STATUS)"
          else
            echo "❌ Frontend not served (HTTP $STATUS)"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ── Push Docker image (only on main branch push) ───────────────
  docker-push:
    runs-on: ubuntu-latest
    needs: [docker-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build --no-cache
          docker compose -f docker-compose.yml -f docker-compose.ci.yml push
          echo "✅ Image pushed to $IMAGE:latest"
