name: CI — Build, Test & Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'odd/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'odd/**'
      - '**/*.md'

# One run per ref: a newer push cancels the run it supersedes. Without this a
# stacked chain (one run per PR, one per merge) pays for every run to the end,
# and two publishers race to overwrite the same image tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Matches the runtime in the Dockerfile (node:22-alpine).
  # jsdom@30 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0.
  NODE_VERSION: "22"

jobs:
  # ── Backend tests ──────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run all backend tests
        run: |
          cd backend
          python -m pytest -v --tb=short

  # ── Frontend build ─────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

      - name: TypeScript check + Vite build
        run: |
          cd frontend
          npm run build

  # ── Docker build + health check ────────────────────────────────
  docker-verify:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build --no-cache

      - name: Start container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          sleep 15

      - name: Health check (port 8000)
        run: |
          # /api/health is the liveness probe: /api/status carries real data and
          # now requires the API key, which CI does not have.
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "⏳ Attempt $i: HTTP $STATUS — retrying in 3s..."
            sleep 3
          done
          echo "❌ Backend did not start within 45s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=50
          exit 1

      - name: Frontend served by backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ 2>/dev/null || true)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend served (HTTP $STATUS)"
          else
            echo "❌ Frontend not served (HTTP $STATUS)"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ── End-to-end tests (Playwright) ──────────────────────────────
  # Runs the e2e/ suite against a real container — NOW IN TWO VARIANTS, each
  # with its own up → test → down -v so a fresh container starts each phase:
  #   1. bare — docker-compose.yml + docker-compose.ci.yml: a container with
  #      NO services. specs/auth.spec.ts + specs/dashboard-bare.spec.ts pin
  #      the bare install (honest empty state, gated nav) and must keep
  #      running against a service-less container.
  #   2. stub — + docker-compose.e2e.yml (the fake-arr Radarr stub on the
  #      same compose network): specs/flow-faltantes.spec.ts +
  #      specs/flow-release-search.spec.ts pin the headline flow
  #      (Faltantes → buscar release → encolar).
  # Phase 2 runs only if phase 1 is green (default fail-fast); the job log is
  # the record of which variant broke.
  #
  # Deliberately a sibling of docker-verify, not part of it, and NOT in
  # docker-push's needs chain: a brand-new browser suite must not be able to
  # block image publishing until it has earned that.
  #
  # Promotion criterion (agreed when this job landed, so it is not a vague
  # decision in six months): add `e2e` to docker-push's `needs` once it has
  # run **20 consecutive green runs on main** with no manual intervention and
  # no `waitForTimeout` anywhere in the specs. Until then a red e2e is
  # visible on the PR and on main, and it never holds an image back.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    # The workflow carries no other timeout; without this a hung browser run
    # would sit on GitHub's 6-hour default. It now covers BOTH variants.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        # One build serves both phases; the stub image (node:22-alpine) is
        # pulled, not built, so it is not part of this step.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build --no-cache

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright browser
        # `--with-deps` also installs the OS libraries the browser needs
        # (libnspr4 & co — they are NOT in the runner image by default).
        run: |
          cd e2e
          npx playwright install --with-deps chromium

      # ── Phase 1: bare install (no services) ─────────────────────
      - name: "Phase 1 — start bare container"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          sleep 15

      - name: "Phase 1 — health check (port 8000)"
        run: |
          # Same bounded loop as docker-verify: /api/health is the liveness
          # probe, /api/status requires the API key, which CI does not have
          # in the test runner.
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "⏳ Attempt $i: HTTP $STATUS — retrying in 3s..."
            sleep 3
          done
          echo "❌ Backend did not start within 45s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=50
          exit 1

      - name: "Phase 1 — run bare specs"
        run: |
          cd e2e
          npx playwright test specs/auth.spec.ts specs/dashboard-bare.spec.ts

      - name: "Phase 1 — teardown"
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

      # ── Phase 2: stub-backed install (fake-arr) ──────────────────
      - name: "Phase 2 — start stub-backed container"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.e2e.yml up -d
          sleep 15

      - name: "Phase 2 — health check (app :8000 + fake-arr __health)"
        run: |
          # Both must answer: the app via its liveness probe, the stub via
          # __health on its published 127.0.0.1:4400 (see docker-compose.e2e.yml).
          for i in $(seq 1 10); do
            APP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health 2>/dev/null || true)
            STUB=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4400/__health 2>/dev/null || true)
            if [ "$APP" = "200" ] && [ "$STUB" = "200" ]; then
              echo "✅ Backend healthy (HTTP $APP), fake-arr healthy (HTTP $STUB)"
              exit 0
            fi
            echo "⏳ Attempt $i: app HTTP $APP, stub HTTP $STUB — retrying in 3s..."
            sleep 3
          done
          echo "❌ App or fake-arr did not come up within 45s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.e2e.yml logs --tail=50
          exit 1

      - name: "Phase 2 — run stub specs"
        run: |
          cd e2e
          npx playwright test specs/flow-faltantes.spec.ts specs/flow-release-search.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        # All three files: the same compose project, so this removes whichever
        # variant (or both) is still up.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.e2e.yml down -v

  # ── Push Docker image (only on main branch push) ───────────────
  docker-push:
    runs-on: ubuntu-latest
    needs: [docker-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build --no-cache
          docker compose -f docker-compose.yml -f docker-compose.ci.yml push
          # An immutable tag per commit. `:latest` moves, so without this there
          # is no way to tell which commit an image holds once a later run has
          # published over it.
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          docker tag "$IMAGE:latest" "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:sha-$SHORT_SHA"
          echo "✅ Image pushed: $IMAGE:latest and $IMAGE:sha-$SHORT_SHA"

      - name: Keep only 5 latest versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: flow-controller
          package-type: container
          min-versions-to-keep: 5
          delete-only-pre-release-versions: false
