# CI override — no host mounts, no network_mode
services:
  flow-controller:
    image: ghcr.io/alountk/flow-controller:latest
    network_mode: null
    ports:
      - "8000:8000"
    volumes: []          # remove all host mounts
    environment:
      - SAFE_MODE=true
      - DEVELOPER=false
      - API_KEY=test-key
      # `volumes: []` above does not drop the base file's bind mount (compose
      # concatenates lists), so /app/config is a root-owned host dir the
      # 1000:1000 service cannot write. Settings, history and the login account
      # all need a writable CONFIG_DIR; /tmp always is. Production mounts a
      # writable volume.
      - CONFIG_DIR=/tmp/fc-config
