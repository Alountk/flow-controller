# CI override — no host mounts, no network_mode
services:
  flow-controller:
    image: ghcr.io/alountk/flow-controller:latest
    network_mode: null
    ports:
      - "8000:8000"
    volumes: []          # remove all host mounts
    environment:
      - SAFE_MODE=true
      - DEVELOPER=false
      - API_KEY=test-key
