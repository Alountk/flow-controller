services:
  flow-controller:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # Only what the container needs to boot. Service URLs, credentials and
      # intervals live in settings.json (Configuración in the UI): deployment
      # variables used to override the file on every start, so an edit in the UI
      # silently did nothing. Run once with these set to seed a fresh install;
      # after that the file is the single source of truth.
      - PORT=${PORT:-8000}
    volumes:
      - /mnt/storage/config/flow-control:/app/config
      - /mnt/storage:/mnt/storage:rw
      - /mnt/storage-6tb:/mnt/storage-6tb:rw
      - ./prototypes:/app/prototypes:ro
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"
