services:
  flow-controller:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - CHECK_INTERVAL=15
      - MAX_RETRIES=3
      - RETRY_DELAY=2
    volumes:
      - /mnt/storage:/mnt/storage:ro
      - /mnt/storage-6tb:/mnt/storage-6tb:ro
      - ./prototypes:/app/prototypes:ro
